name: Release npm package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11.12.1
      - run: npm ci
      - name: Require a release tag matching the package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF" = "refs/tags/v${package_version}"
      - name: Refuse an already-published version
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published."
            exit 1
          fi
      - run: npm publish --access public --provenance
